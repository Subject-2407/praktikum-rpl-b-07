<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ScapesMod - Admin Portal</title>
	<link rel="stylesheet" href="./styles/output.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'DM Sans', sans-serif; }

		@keyframes fadeUp {
			from { opacity: 0; transform: translateY(12px); }
			to   { opacity: 1; transform: translateY(0); }
		}
		.fade-up { animation: fadeUp 0.35s ease both; }
		.fade-up-delay { animation: fadeUp 0.35s ease 0.1s both; }
	</style>
</head>
<body class="bg-zinc-100 text-gray-800 min-h-screen overflow-x-hidden">

<div class="max-w-7xl mx-auto px-10 py-8">

	<a href="./index.html"
	   class="w-full inline-flex items-center gap-2 text-sm text-gray-400 hover:text-brand transition-colors duration-150 mb-6 group">
		<svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform duration-150" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
			<path d="M15 19l-7-7 7-7"/>
		</svg>
		Back to Queue
	</a>

	<div class="flex flex-row items-start justify-between gap-6 pb-6 border-b border-gray-200 fade-up">
		<div>
			<p class="text-xs font-mono text-brand uppercase tracking-widest mb-1">Review Item</p>
			<h1 class="text-2xl font-bold text-gray-900 tracking-tight">Mountain Sunrise</h1>
		</div>
		<div class="text-left">
			<p class="text-xs text-gray-400">Reviewing as</p>
			<p class="text-sm font-semibold text-gray-700">Admin 1</p>
		</div>
	</div>

	<div class="pt-8">
		<div class="grid grid-cols-[minmax(0,1.25fr)_minmax(320px,0.75fr)] gap-6 items-start">

			<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden fade-up">
				<div class="bg-stone-200 flex items-center justify-center p-6 h-98 border-b border-gray-100">
					<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1200'%3E%3Crect width='1600' height='1200' fill='%23d6d3d1'/%3E%3Ccircle cx='420' cy='420' r='120' fill='%23a8a29e'/%3E%3Cpath d='M180 1020l320-320 220 220 150-150 550 550H180z' fill='%23cfc7bf'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' fill='%236b7280' font-family='sans-serif' font-size='64'%3EPreview%3C/text%3E%3C/svg%3E" class="max-h-full max-w-full w-auto h-auto object-contain" alt="Preview">
				</div>
			</div>

			<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden fade-up-delay">
				<div class="px-8 py-6 space-y-4 border-b border-gray-100">
					<div class="flex items-start gap-4">
						<span class="w-36 text-xs font-semibold text-gray-400 uppercase tracking-widest shrink-0 pt-0.5">Title</span>
						<span class="text-sm text-gray-800">Mountain Sunrise</span>
					</div>

					<div class="flex items-start gap-4">
						<span class="w-36 text-xs font-semibold text-gray-400 uppercase tracking-widest shrink-0 pt-0.5">Description</span>
						<span class="text-sm text-gray-800">A beautiful golden sunrise over snow-capped mountains</span>
					</div>

					<div class="flex items-start gap-4">
						<span class="w-36 text-xs font-semibold text-gray-400 uppercase tracking-widest shrink-0 pt-0.5">Contributor</span>
						<span class="text-sm text-gray-800">@alice</span>
					</div>

					<div class="flex items-start gap-4">
						<span class="w-36 text-xs font-semibold text-gray-400 uppercase tracking-widest shrink-0 pt-0.5">Tags</span>
						<span class="text-sm text-gray-800">nature, landscape, sunrise, 4k</span>
					</div>

					<div class="flex items-start gap-4">
						<span class="w-36 text-xs font-semibold text-gray-400 uppercase tracking-widest shrink-0 pt-0.5">Date</span>
						<span class="text-sm text-gray-800">01/3/26</span>
					</div>
				</div>

				<div class="px-8 py-6 flex flex-col gap-3">
					<button
						type="button"
						class="w-full bg-brand hover:bg-brand-dark text-white font-semibold rounded-xl py-3.5 text-sm transition-all duration-200 shadow-sm hover:shadow-md">
						✓ &nbsp; Approve
					</button>

					<button
						type="button"
                        onclick="document.getElementById('rejectModal').classList.remove('hidden')"
						class="w-full bg-white hover:bg-red-200 text-red-500 border-2 border-red-300 font-semibold rounded-xl py-3.5 text-sm transition-all duration-200">
						✕ &nbsp; Reject
					</button>
				</div>
			</div>

		</div>
	</div>

</div>

<div id="rejectModal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4" onclick="if(event.target===this) this.classList.add('hidden')">
	<div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm"></div>

	<div class="relative bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-md p-8 z-10">
		<h2 class="text-base font-bold text-gray-900 mb-1 text-center">Reason for rejection</h2>
		<p class="text-xs text-gray-400 text-center mb-5">This will be sent to the contributor.</p>

		<textarea
			id="rejectReason"
			rows="4"
			placeholder="Describe why this submission is being rejected..."
			class="w-full bg-gray-50 border border-gray-400 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-400 resize-none focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 transition-all duration-200 mb-5"></textarea>

		<div class="flex gap-3">
			<button
				type="button"
				onclick="document.getElementById('rejectModal').classList.add('hidden')"
				class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-xl py-3 text-sm transition-all duration-200">
				Cancel
			</button>

			<button
				type="button"
				onclick="document.getElementById('rejectModal').classList.add('hidden')"
				class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl py-3 text-sm transition-all duration-200 shadow-sm">
				Reject
			</button>
		</div>
	</div>
</div>

</body>
</html>
