<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Scapes - Admin Portal</title>
	<link rel="stylesheet" href="./styles/output.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'DM Sans', sans-serif; }

		.nav-item-active {
			background-color: #e6f4f7 !important;
			color: #0d6374 !important;
			font-weight: 600;
		}

		.nav-item-inactive {
			color: rgba(255, 255, 255, 0.7);
		}
		.nav-item-inactive:hover {
			background-color: rgba(255, 255, 255, 0.1);
			color: white;
		}

		::-webkit-scrollbar { width: 6px; }
		::-webkit-scrollbar-track { background: #f1f5f9; }
		::-webkit-scrollbar-thumb { background: #b3d9e0; border-radius: 3px; }

		@keyframes fadeUp {
			from { opacity: 0; transform: translateY(12px); }
			to   { opacity: 1; transform: translateY(0); }
		}
		.fade-up { animation: fadeUp 0.35s ease both; }
		.fade-up-delay { animation: fadeUp 0.35s ease 0.1s both; }

		@media (max-width: 767px) {
			main {
				overflow-x: hidden;
			}

			.admin-queue-table {
				table-layout: fixed;
				width: 100%;
			}

			.admin-queue-table th:nth-child(1),
			.admin-queue-table td:nth-child(1) {
				width: 3.75rem;
				padding-right: 0.75rem;
			}

			.admin-queue-table th:nth-child(2),
			.admin-queue-table td:nth-child(2) {
				width: auto;
				min-width: 0;
				padding-left: 3.5rem;
			}

			.admin-queue-table th:nth-child(3),
			.admin-queue-table td:nth-child(3),
			.admin-queue-table th:nth-child(5),
			.admin-queue-table td:nth-child(5) {
				display: none;
			}

			.admin-queue-table th:nth-child(4),
			.admin-queue-table td:nth-child(4) {
				width: 6.5rem;
			}

			.admin-queue-table td:nth-child(2) {
				word-break: break-word;
				overflow-wrap: anywhere;
			}

			.admin-queue-table td:first-child div {
				width: 4.25rem;
				height: 3rem;
			}
		}
	</style>
</head>
<body class="bg-zinc-100 text-gray-800 min-h-screen overflow-x-hidden">

<div id="app-content" style="display: none;" class="flex min-h-screen">

	<aside
		id="adminSidebar"
		class="w-64 sm: w-72 bg-brand-dark border-r border-white/10 flex flex-col fixed inset-y-0 left-0 z-30 h-screen shadow-sm transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out overflow-y-auto">

		<div class="px-6 pt-8 pb-6 border-b border-white/10 flex items-start justify-between relative">			
			<div class="flex items-center gap-3">
				<img src="./assets/logo/scapes.png" alt="Scapes" class="w-10 h-10 rounded-xl bg-white/5 p-1 shadow-sm shrink-0" />
				<div>
					<span class="block text-2xl font-bold text-white tracking-tight">Scapes</span>
					<p class="text-[10px] text-brand-muted font-mono mt-1 uppercase tracking-widest">Admin Portal</p>
				</div>

				<button onclick="closeSidebar()" class="md:hidden self-center absolute top-1/2 -translate-y-1/2 right-4 p-2 text-white/50 hover:text-white hover:bg-white/10 rounded-lg transition-colors">					
					<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
					</svg>
           		</button>
			</div>
		</div>

		<nav class="flex-1 px-3 py-6 space-y-1">
			<a href="./index.html"
			   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-all duration-150 nav-item-active">
				<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
					<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
					<rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
				</svg>
				Queue
			</a>
		</nav>

		<div class="px-3 pb-8 border-t border-white/10 pt-4">
			<a href="./login.html"
				class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-white/60 border border-transparent hover:text-white hover:bg-white/5 hover:border-white/10 transition-all duration-150">
				<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
					<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
				</svg>
				Log out
			</a>
		</div>

	</aside>

    <div id="sidebarBackdrop" class="fixed inset-0 z-20 bg-gray-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200 md:hidden"></div>

	<main class="ml-0 md:ml-72 flex-1 min-h-screen overflow-x-hidden">

		<div class="px-3 sm:px-4 md:px-6 lg:px-10 pt-7 sm:pt-8 lg:pt-10 pb-6 border-b border-gray-100 bg-stone-50 fade-up">
			<div class="flex items-start justify-between gap-4">
				<div class="pl-1 sm:pl-0">
					<button id="sidebarToggle" type="button" aria-controls="adminSidebar" aria-expanded="false" class="inline-flex md:hidden items-center justify-center rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm font-semibold text-gray-700 shadow-sm transition-colors duration-150 hover:bg-gray-50">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
							<path d="M4 6h16M4 12h16M4 18h16" />
						</svg>
						<span class="ml-2">Menu</span>
					</button>
					<p class="text-xs font-mono text-brand uppercase tracking-widest mb-1 mt-4 md:mt-0">Moderation Queue</p>
					<h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-gray-900 tracking-tight">Welcome back, Admin</h1>
				</div>
			</div>
		</div>

		<div class="px-3 sm:px-4 md:px-6 lg:px-10 py-6 sm:py-8 fade-up-delay">

			<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
				<div class="bg-stone-50 rounded-2xl border border-gray-100 px-6 py-5 shadow-sm">
					<p class="text-xs font-mono text-gray-400 uppercase tracking-widest mb-1">Total Submitted</p>
					<p class="text-3xl font-bold text-amber-500">0</p>
				</div>

				<div class="bg-stone-50 rounded-2xl border border-gray-100 px-6 py-5 shadow-sm">
					<p class="text-xs font-mono text-gray-400 uppercase tracking-widest mb-1">Need Review</p>
					<p class="text-3xl font-bold text-brand">0</p>
				</div>

				<div class="bg-stone-50 rounded-2xl border border-gray-100 px-6 py-5 shadow-sm">
					<p class="text-xs font-mono text-gray-400 uppercase tracking-widest mb-1">Done</p>
					<p class="text-3xl font-bold text-emerald-500">0</p>
				</div>
			</div>

			<div class="bg-stone-50 rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

                <div class="px-3 sm:px-4 md:px-6 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
					<h2 class="font-semibold text-gray-800 text-sm">Recent Uploads</h2>
					<span id="queueItemCount" class="text-xs font-mono text-gray-400">0 items</span>
				</div>

				<div class="overflow-x-auto">
					<table class="admin-queue-table w-full table-auto text-sm">
						<thead>
							<tr class="bg-gray-50/50 text-left">
                                <th class="px-4 sm:px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-widest">Thumbnail</th>
								<th class="px-4 sm:px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-widest">Title</th>
                                <th class="hidden md:table-cell px-4 sm:px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-widest">Contributor</th>
								<th class="px-4 sm:px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-widest">Status</th>
                                <th class="hidden md:table-cell px-4 sm:px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-widest">Date</th>
							</tr>
						</thead>
						<tbody class="divide-y divide-gray-100">
							<!-- data will be populated here -->
						</tbody>
					</table>
				</div>
			</div>
		</div>

	</main>

</div>

<script>
    const sidebar = document.getElementById('adminSidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const toggle = document.getElementById('sidebarToggle');

    function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.classList.add('overflow-hidden');
    }

    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('overflow-hidden');
    }

    toggle.addEventListener('click', function () {
        if (sidebar.classList.contains('-translate-x-full')) {
            openSidebar();
        } else {
            closeSidebar();
        }
    });

    backdrop.addEventListener('click', closeSidebar);

    document.querySelectorAll('#adminSidebar a').forEach(function (link) {
        link.addEventListener('click', function () {
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        });
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            closeSidebar();
        }
    });
</script>
<script type="module" src="scripts/logout.js"></script>
<script type="module" src="./scripts/queue-page.js"></script>
</body>
</html>
