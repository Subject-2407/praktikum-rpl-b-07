<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Scapes — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link href="dist/output.css" rel="stylesheet" />
  
  <script src="login.js" defer></script>
</head>
<body class="bg-surface text-ink min-h-screen m-0 font-sans">

<div class="flex min-h-screen">
  <div class="left-panel relative hidden md:flex flex-col justify-center px-12 lg:px-16" style="flex:0 0 42%; background:#E4E2DE; border-right:1.5px solid #D6D3CE;">
    <div class="anim-left max-w-xs">
      <p class="text-2xl lg:text-3xl font-display font-semibold leading-snug" style="letter-spacing:-.01em;">
        Share your walls<br />with the world
      </p>
      <p class="mt-3 text-base font-light text-[#5C5955]">
        Join a community of <span class="link-scapes font-medium text-ink">Scapes</span>
      </p>
    </div>
    <div style="position:absolute;bottom:32px;left:40px;font-size:11px;color:#B0ADA8;letter-spacing:.12em;">
      © SCAPES 2026
    </div>
  </div>

  <div class="flex flex-1 flex-col items-center justify-center px-8" style="background:#FAFAF8;">
    <div class="w-full max-w-sm">
      <div class="flex justify-center mb-10 anim-1">
        <div class="logo-circle">logo</div>
      </div>

      <div class="md:hidden text-center mb-8 anim-1">
        <p class="text-xl font-display font-semibold">Share your walls<br/>with the world</p>
        <p class="text-sm font-light mt-1" style="color:#5C5955;">
          Join a community of <span class="link-scapes font-medium text-ink">Scapes</span>
        </p>
      </div>

      <div id="alert-blocked" class="alert alert-warning anim-2 mb-3" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="flex-shrink-0 mt-[1px]">
          <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM8 5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 5zm0 6.5a.875.875 0 1 1 0-1.75.875.875 0 0 1 0 1.75z" fill="#7D6608"/>
        </svg>
        <span>Terlalu banyak percobaan gagal. Coba lagi dalam <strong><span id="countdown-display">30</span> detik</strong>.</span>
      </div>

      <div id="alert-error" class="alert alert-error anim-2 mb-3" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="flex-shrink-0 mt-[1px]">
          <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM8 5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 5zm0 6.5a.875.875 0 1 1 0-1.75.875.875 0 0 1 0 1.75z" fill="#922B21"/>
        </svg>
        <span id="alert-error-text">Email atau password tidak valid.</span>
      </div>

      <div id="login-form" class="space-y-3">
        <div class="anim-2">
          <input id="inp-email" type="email" placeholder="Email" class="field-input" autocomplete="email" spellcheck="false" aria-label="Email" />
        </div>
        <div class="anim-3">
          <input id="inp-password" type="password" placeholder="Password" class="field-input" autocomplete="current-password" aria-label="Password" />
        </div>
        <div class="anim-4 pt-0.5">
          <a href="#" class="link-subtle">Forgot your password?</a>
        </div>

        <div class="attempt-wrap anim-4" id="attempt-wrap">
          <div class="attempt-dots" id="attempt-dots"></div>
          <p id="attempt-txt" class="text-center text-[12px] text-muted mt-1"></p>
        </div>

        <div class="anim-4 pt-2">
          <button id="btn-login" class="btn-primary" type="button">
            <span id="btn-label">Log in</span>
            <span id="btn-spin" class="spinner"></span>
          </button>
        </div>
      </div>

      <div class="anim-5 my-7"><div class="divider"></div></div>
      <div class="anim-5 text-center">
        <span class="link-subtle">New here?&nbsp;</span>
        <a href="#" class="link-create">Create an account</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
